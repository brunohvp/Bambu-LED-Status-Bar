; Bambu LED Status Bar (BambuEsp32MQTT)
; ESP32 / ESP32-C3 + Bambu Lab LAN-mode MQTT status LED strip, web setup + settings UI
; https://github.com/brunohvp/Bambu-LED-Status-Bar

[platformio]
; Plain `pio run -t upload` builds/flashes the original ESP32 DevKit target only.
; For an ESP32-C3 board: pio run -e esp32c3 -t upload
default_envs = esp32dev

[env]
; Using the pioarduino fork instead of the official espressif32 platform — it
; tracks newer ESP-IDF/mbedTLS releases than the official PlatformIO registry,
; which may include fixes for the WiFiClientSecure/mbedTLS SSL instability
; documented in README > Phase 2/4 (a framework-level bug, not our code).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
; The default 1.25 MB app slot is too small with Arduino core 3.3.x. min_spiffs keeps
; the OTA layout (2 x 1.9 MB) and the NVS at the same offset, so saved settings survive.
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

lib_deps =
    ESP32Async/ESPAsyncWebServer
    ESP32Async/AsyncTCP
    bblanchon/ArduinoJson @ ^7
    knolleary/PubSubClient @ ^2.8
    fastled/FastLED @ ^3.9

build_flags =
    -DCORE_DEBUG_LEVEL=1

; Classic ESP32-WROOM-32 DevKit (the original target): strip data defaults to GPIO16.
[env:esp32dev]
board = esp32dev

; ESP32-C3 board with native USB (e.g. C3 SuperMini). Strip data defaults to GPIO4
; (changeable in Settings > LED Strip), onboard LED on GPIO8 (active low).
[env:esp32c3]
board = esp32-c3-devkitm-1
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLED_DATA_PIN=4
    -DSTATUS_LED_PIN=8
    -DSTATUS_LED_ACTIVE_HIGH=false
