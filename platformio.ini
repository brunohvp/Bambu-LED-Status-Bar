; Bambu LED Status Bar (BambuEsp32MQTT)
; ESP32 WROOM DevKit + Bambu Lab LAN-mode MQTT status LED, WS2811 strip, web setup + settings UI
; https://github.com/brunohvp/Bambu-LED-Status-Bar

[env:esp32dev]
; Using the pioarduino fork instead of the official espressif32 platform — it
; tracks newer ESP-IDF/mbedTLS releases than the official PlatformIO registry,
; which may include fixes for the WiFiClientSecure/mbedTLS SSL instability
; documented in README > Phase 2/4 (a framework-level bug, not our code).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

lib_deps =
    ESP32Async/ESPAsyncWebServer
    ESP32Async/AsyncTCP
    bblanchon/ArduinoJson @ ^7
    knolleary/PubSubClient @ ^2.8
    fastled/FastLED @ ^3.9

build_flags =
    -DCORE_DEBUG_LEVEL=1
